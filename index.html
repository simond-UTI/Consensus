ng:4px 12px 5px 0;text-align:left!important;background:#13151a;border-bottom:1px solid rgba(255,255,255,0.15);cursor:pointer;white-space:nowrap;user-select:none}tr.ch>th:first-child{padding-left:16px}tr.ch>th:hover{color:#00e676!important}tr.ch>th.s{color:#00e676!important}tr.ch>th.gend{padding-right:32px!important}td{padding:0 12px 0 0;height:26px;border:none;vertical-align:middle;white-space:nowrap;text-align:left;font-size:12px;color:#fff!important}td:first-child{padding-left:16px}td.gend{padding-right:32px!important}tr:hover>td{background:rgba(255,255,255,0.04)}tr.rhc>td:first-child{border-left:2px solid #00e676}tr.rxt>td:first-child{border-left:2px solid #ff1744}tr.rmo>td:first-child{border-left:2px solid transparent}tr.rbl>td:first-child{border-left:2px solid transparent}.cg{color:#00e676!important}.cr{color:#ff1744!important}.cw{color:#fff!important}.cdim{color:rgba(255,255,255,0.2)!important}.gears{display:inline-flex;gap:5px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}.don{background:#00e676}.dof{background:#ff1744}.dnu{background:rgba(255,255,255,0.15)}.msg{padding:40px 16px;color:rgba(255,255,255,0.25);font-size:12px}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:#13151a}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}.tip{position:relative;cursor:help}.tip::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:0;background:#0d0f13;border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;font-weight:400;line-height:1.6;padding:8px 10px;border-radius:4px;width:320px;white-space:pre-line;z-index:100;pointer-events:none;opacity:0;transition:opacity 0.15s;font-family:'Roboto Mono',monospace;letter-spacing:0}.tip:hover::after{opacity:1}.spec-link{font-size:11px;color:rgba(255,255,255,0.25);cursor:pointer;font-family:'Roboto Mono',monospace;letter-spacing:0.05em;user-select:none;transition:color 0.15s}.spec-link:hover{color:rgba(255,255,255,0.8)}.spec-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center}.spec-overlay.on{display:flex}.spec-modal{background:#0d0f13;border:1px solid rgba(255,255,255,0.2);width:min(900px,95vw);max-height:90vh;display:flex;flex-direction:column;font-family:'Roboto Mono',monospace}.spec-head{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.15);flex-shrink:0}.spec-head .t{font-size:13px;font-weight:600;color:#fff;letter-spacing:0.05em}.spec-head .m{font-size:11px;color:rgba(255,255,255,0.4);margin-left:auto}.spec-head .x{font-size:16px;color:rgba(255,255,255,0.5);cursor:pointer;padding:0 4px;user-select:none}.spec-head .x:hover{color:#fff}.spec-body{overflow-y:auto;padding:16px 20px;font-size:11px;line-height:1.55;color:#d8d8d8;white-space:pre-wrap;font-family:'Roboto Mono',monospace;word-wrap:break-word}.spec-body::-webkit-scrollbar{width:6px}.spec-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15)}.qcell{font-weight:600}.prof{font-size:10px;font-weight:600;letter-spacing:0.02em}

/* Sticky Ticker column */
tr.ch>th:first-child{position:sticky;left:0;background:#13151a;z-index:11}
tr.gh>th:first-child{position:sticky;left:0;background:#13151a;z-index:11}
tbody td:first-child{position:sticky;left:0;background:#13151a;z-index:5}
tbody tr:hover td:first-child{background:#1a1d24}
tr.rhc>td:first-child{background:#13151a}
tr.rxt>td:first-child{background:#13151a}
tr.rmo>td:first-child{background:#13151a}
tr.rbl>td:first-child{background:#13151a}</style></head><body>

<div class="top">
  <span class="logo" style="cursor:pointer" onclick="location.reload()">2H</span>
  <span class="spec-link" onclick="openSpec()" title="System specification">[SPEC]</span>
  <select onchange="setWL(this.value)">
    <option value="UK ETFS">UK</option>
    <option value="MAIN">US</option>
  </select>
  <select id="gsel" onchange="setGrp(this.value)">
    <option value="">All Groups</option>
  </select>
  <select id="psel" onchange="setProf(this.value)">
    <option value="">All Profiles</option>
    <option value="4_LEADER_ACCEL">LEADER ACCEL</option>
    <option value="5_LEADER_EXTENDED">LEADER EXTENDED</option>
    <option value="6_NARROW_LEADER">LEADER NARROW</option>
    <option value="2_NONLEADER_ACCEL">SETUP CLEAN</option>
    <option value="3_BROAD_MIDSTRENGTH">SETUP BROAD</option>
    <option value="1_WEAK_ACCEL">SETUP RECOVERY</option>
    <option value="7_WEAK_DECLINING">WEAK</option>
    <option value="0_MID">MID</option>
  </select>
  <div class="sr"><input id="sr" placeholder="Search…" oninput="af()"></div>
</div>

<div class="wrap"><table>
  <thead>
    <tr class="gh">
      <th class="blank" colspan="2"></th>
      <th colspan="5" class="gsep-lg gend">Overall</th>
      <th colspan="4" class="gsep gend">Trend</th>
      <th colspan="3" class="gsep gend">Velocity</th>
      <th colspan="3" class="gsep gend">Volume</th>
      <th colspan="2" class="gsep gend">Volatility</th>
      <th colspan="5" class="gsep gend">Price</th>
      <th colspan="4" class="gsep">Structure</th>
    </tr>
    <tr class="ch">
      <th style="min-width:70px;padding-left:16px" onclick="sb('symbol')">Ticker</th>
      <th style="min-width:80px;max-width:100px" onclick="sb('group_name')">Group</th>

      <!-- OVERALL: Rank (alignment), R Mv, Cons, Net, Profile -->
      <th class="gsep-lg tip" style="min-width:50px" onclick="sb('rank_alignment')"
          data-tip="RANK — Alignment rank across all 7 Q-scores.&#10;&#10;WHAT: Position by overall agreement across every dimension (trend, momentum, acceleration, volume, price, structure, volatility).&#10;&#10;RANGE: 1 to ~165 within the watchlist. Rank 1 = broadest factual agreement across all Q-scores.&#10;&#10;BUILT FROM: DENSE_RANK() sorted by net_score (sum of Q1..Q7) descending.&#10;&#10;EXAMPLE: Rank 5 means 4 other tickers have a higher net Q-score sum than this one.&#10;&#10;This stays constant regardless of column sort — your anchor.">Rank</th>
      <th class="tip" style="min-width:48px" onclick="sb('fact_rank_move')"
          data-tip="R MV — Rank Movement versus yesterday.&#10;&#10;WHAT: How many positions this ticker climbed or fell on the alignment rank since yesterday.&#10;&#10;RANGE: Typically -100 to +100.&#10;Positive = climbed toward rank 1. Negative = fell.&#10;&#10;BUILT FROM: Today's rank_alignment minus yesterday's.&#10;&#10;CURRENT: Shows 0 — yesterday comparison not yet implemented in v2.">R Mv</th>
      <th class="tip" style="min-width:40px" onclick="sb('consensus')"
          data-tip="CONS — Consensus count.&#10;&#10;WHAT: How many Q-scores are above zero.&#10;&#10;RANGE: 0 to 7.&#10;6-7 = broad agreement across dimensions&#10;3-4 = mixed signals&#10;0-2 = broadly negative&#10;&#10;BUILT FROM: Count of Q1..Q7 values greater than 0.&#10;&#10;EXAMPLE: Cons=6 means 6 out of 7 dimensions agree positive.">Cons</th>
      <th class="tip" style="min-width:52px" onclick="sb('net_score')"
          data-tip="NET — Sum of all 7 Q-scores.&#10;&#10;WHAT: Total directional conviction across dimensions.&#10;&#10;RANGE: -7.00 to +7.00.&#10;Positive = directional conviction up. Negative = down. Zero = balanced.&#10;&#10;BUILT FROM: Q1 + Q2 + Q3 + Q4 + Q5 + Q6 + Q7.&#10;&#10;EXAMPLE: Net +4.50 is strong positive alignment; the rank column is driven by this.&#10;&#10;NOTE: Q5 positive adds to Net despite meaning 'extended' — so a very high Net may include extension warning.">Net</th>
      <th class="tip gend" style="min-width:140px" onclick="sb('profile')"
          data-tip="PROFILE — Factual state label for this ticker.&#10;&#10;WHAT: Cycle-ordered label derived from strength quintile, alignment quintile, and Q-score filters.&#10;&#10;LABELS (cycle order 0-7):&#10;&#10;0 MID — nothing notable&#10;1 SETUP RECOVERY — Q1<0 + Q3>0 + Q4>0 (early turn with volume)&#10;2 SETUP CLEAN — Q1>0 + Q5<0 + not top strength (clean developing setup)&#10;3 SETUP BROAD — alignment quintile 1 + strength quintile 2+ (broadly aligned)&#10;4 LEADER ACCEL — top strength + Q1>0 + Q5<0 (top strength, clean)&#10;5 LEADER EXTENDED — top strength + Q5 top quintile + (Q3<0 OR Q4<0) (top strength, extension warning)&#10;6 LEADER NARROW — top strength + alignment quintile 3+ (strong on trend/mom, weak broader agreement)&#10;7 WEAK — alignment bottom quintile (broken down)&#10;&#10;CYCLE INTERPRETATION:&#10;0 = idle&#10;1-3 = healthy progression (improving)&#10;4-6 = at peak (different flavours of risk)&#10;7 = failure&#10;&#10;COLOUR:&#10;Green: LEADER ACCEL, SETUP CLEAN (growth)&#10;Red: WEAK&#10;White: everything else (warnings embedded in labels)&#10;&#10;Rules evaluated in order — first match wins. Sort column to group similar states.">Profile</th>

      <!-- TREND: Q1, Q2, trend, momentum -->
      <th class="gsep tip s" style="min-width:54px" onclick="sb('q1_t')"
          data-tip="Q1 TRENDING — Multi-pair reading of trend strength, direction, structural support, volume confirmation, and relative-to-self significance.&#10;&#10;RANGE: -1.00 to +1.00&#10;+1 = all pairs in most bullish state&#10; 0 = neutral across pairs&#10;-1 = all pairs in most bearish state&#10;&#10;BUILT FROM 8 matrix pairs (each produces a quadrant state contributing [-1, +1]):&#10;  P01 trend × momentum (core direction)&#10;  P02 trend × trend_d5 (trend velocity)&#10;  P05 trend × vol_regime (regime context)&#10;  P06 trend × rel_vol (volume confirmation)&#10;  P10 structure × pct_to_ph (HARNESS EARNED)&#10;  P12 pct_to_ph × rel_vol (breakout + volume)&#10;  P13 pct_to_ph × vol_roc (breakout + vol trajectory)&#10;  P30 trend × trend_z_60d (relative-to-self)&#10;&#10;Q1 = average of pair quadrant contributions.&#10;&#10;EXAMPLE: +0.75 means most pairs are in bullish quadrants.&#10;&#10;DEFAULT SORT on load.">Q1 Trend</th>
      <th class="tip" style="min-width:54px" onclick="sb('q2_m')"
          data-tip="Q2 MOMENTUM — Multi-pair reading of 21-bar momentum strength, trajectory, trend relationship, volume confirmation, and relative-to-self significance.&#10;&#10;RANGE: -1.00 to +1.00 (same scale as Q1).&#10;&#10;BUILT FROM 4 matrix pairs:&#10;  P01 trend × momentum (cross-horizon)&#10;  P03 momentum × mom_d5 (momentum velocity)&#10;  P07 momentum × rel_vol (volume confirmation)&#10;  P31 momentum × mom_z_60d (relative-to-self)&#10;&#10;Q2 = average of pair quadrant contributions.&#10;&#10;EXAMPLE: +0.83 means 4 pairs average strongly bullish.&#10;&#10;NOTE: Q2 Mom and raw 'Mom' column both describe momentum. Mom = raw 21-bar composite (-100 to +100). Q2 = factual aggregate across 4 momentum pairs (-1 to +1).">Q2 Mom</th>
      <th class="tip" style="min-width:52px" onclick="sb('trend')"
          data-tip="TREND — Raw 63-bar trend composite.&#10;&#10;WHAT: The long-horizon trend score from your 2H calculation.&#10;&#10;RANGE: -100 to +100&#10;&#10;BUILT FROM: Pine Script trend methodology.&#10;&#10;COLOUR: White (raw number only — Q1 Trend column carries the signal).&#10;&#10;EXAMPLE: 87.0 = very strong positive trend. 80+ is monster-level historically.&#10;&#10;Feeds Q1 (as the core trend signal) via P01, P02, P05, P06, P30.">Trend</th>
      <th class="tip gend" style="min-width:52px" onclick="sb('momentum')"
          data-tip="MOM — Raw 21-bar momentum composite.&#10;&#10;WHAT: The shorter-horizon momentum score (faster than Trend).&#10;&#10;RANGE: -100 to +100&#10;&#10;BUILT FROM: Pine Script momentum methodology, same family as Trend but 21-bar window.&#10;&#10;COLOUR: White (raw number only — Q2 Mom column carries the signal).&#10;&#10;EXAMPLE: 91.4 = very strong momentum. Compared to Trend 87.0 = momentum leading trend = BULL_ACCEL state via P01.&#10;&#10;Feeds Q2 via P01, P03, P07, P31. Historically called 'Trade' in the old system.">Mom</th>

      <!-- VELOCITY: Q3, Gears, d10 -->
      <th class="gsep tip" style="min-width:54px" onclick="sb('q3_a')"
          data-tip="Q3 ACCELERATION — How much the shorter horizons are outrunning the longer ones. Pure velocity read.&#10;&#10;RANGE: -1.00 to +1.00.&#10;Chunky values common (-1, -0.67, -0.33, 0, +0.33, +0.67, +1) because only 3 pairs contribute discrete states.&#10;&#10;BUILT FROM 3 matrix pairs:&#10;  P02 trend × trend_d5 (trend velocity)&#10;  P03 momentum × mom_d5 (momentum velocity)&#10;  P04 mom_d5 × mom_d10 (short vs medium horizon alignment)&#10;&#10;Q3 = average of 3 pair quadrant contributions.&#10;&#10;EXAMPLE: +1.00 = all 3 pairs accelerating.&#10;-0.22 = mixed, mostly decelerating.&#10;&#10;Negative Q3 = warning of slowdown even if trend still positive.">Q3 Accel</th>
      <th class="tip" style="min-width:56px" onclick="sb('mom_d5')"
          data-tip="GEARS — Three-dot velocity read.&#10;&#10;WHAT: Visual quick-read of the 3 velocity signals.&#10;&#10;COMPONENTS (left to right):&#10;  Dot 1: mom_d5 (5-bar momentum change)&#10;  Dot 2: mom_d10 (10-bar momentum change)&#10;  Dot 3: trend_d5 (5-bar trend change)&#10;&#10;COLOUR:&#10;  Green = positive (accelerating)&#10;  Red = negative (decelerating)&#10;  Grey = null/missing&#10;&#10;EXAMPLE: All green = full throttle accelerating. All red = fully decelerating.&#10;&#10;Same signals feed Q3 via matrix pair states.">Gears</th>
      <th class="tip gend" style="min-width:56px" onclick="sb('mom_d10')"
          data-tip="M D10 — 10-bar momentum rate of change.&#10;&#10;WHAT: Raw difference between today's momentum and 10 bars ago.&#10;&#10;RANGE: Typically -20 to +20.&#10;Positive = momentum rising over 10 bars.&#10;Negative = momentum falling.&#10;&#10;BUILT FROM: momentum[now] - momentum[10 bars ago].&#10;&#10;EXAMPLE: +8.0 = meaningful momentum build over 10 bars.&#10;&#10;Feeds Q3 via P04 pair (mom_d5 × mom_d10).">M d10</th>

      <!-- VOLUME: Q4, Rel Vol, Vol ROC -->
      <th class="gsep tip" style="min-width:52px" onclick="sb('q4_v')"
          data-tip="Q4 VOLUME — Is volume confirming the current price action, or is the ticker moving on quiet/fading participation?&#10;&#10;RANGE: -1.00 to +1.00.&#10;Positive = volume backing the move.&#10;Negative = volume dead, fading, or opposing.&#10;&#10;BUILT FROM 7 matrix pairs:&#10;  P06 trend × rel_vol&#10;  P07 momentum × rel_vol&#10;  P08 rel_vol × vol_roc (volume trajectory)&#10;  P09 structure × rel_vol (structural confirmation)&#10;  P12 pct_to_ph × rel_vol (breakout with volume)&#10;  P13 pct_to_ph × vol_roc (breakout volume trajectory)&#10;  P16 price_z × rel_vol (distribution/accumulation)&#10;&#10;Q4 = average of 7 pair contributions.&#10;&#10;EXAMPLE: +0.64 = strong volume confirmation across most pairs.&#10;&#10;CAUTION: UK-listed ETFs on non-UK underlyings may have noisy rel_vol because trading is on LSE but underlying is elsewhere.">Q4 Vol</th>
      <th class="tip" style="min-width:56px" onclick="sb('rel_vol_20d')"
          data-tip="REL VOL — Today's volume versus 20-day average.&#10;&#10;WHAT: How much more (or less) volume today vs typical.&#10;&#10;RANGE: 0× (no volume) to 10×+ (massive spike).&#10;&#10;BUILT FROM: today_volume / 20_day_avg_volume.&#10;&#10;COLOUR: Bold white if ≥ 1.3× (notable spike).&#10;&#10;EXAMPLE: 4.62× = today's volume is 4.6 times average (huge spike, distribution or accumulation signal).&#10;1.00× = exactly average.&#10;0.50× = half normal (quiet).&#10;&#10;Feeds Q4 directly and Q1/Q2/Q6 via multiple matrix pairs.">Rel Vol</th>
      <th class="tip gend" style="min-width:56px" onclick="sb('vol_roc_3d')"
          data-tip="V ROC — Volume rate of change (3-day).&#10;&#10;WHAT: How much volume is building or fading over recent sessions.&#10;&#10;RANGE: Typically -5 to +10.&#10;Positive = volume increasing.&#10;Negative = volume decreasing.&#10;&#10;BUILT FROM: Change in rel_vol over 3 bars.&#10;&#10;EXAMPLE: +3.96 = strong volume build.&#10;-2.48 = volume fading.&#10;&#10;Feeds Q4 via P08 (rel_vol × vol_roc) and Q1 via P13 (pct_to_ph × vol_roc).">V ROC</th>

      <!-- VOLATILITY: Q7, Regime -->
      <th class="gsep tip" style="min-width:52px" onclick="sb('q7_x')"
          data-tip="Q7 VOLATILITY — Is the volatility environment favourable for a trending move?&#10;&#10;RANGE: -1.00 to +1.00.&#10;+1 = expanded vol + monster trend (strongest setup)&#10;+0.67 = expanded vol + bull trend&#10; 0 = normal regime in neutral trend&#10;-0.33 = bearish regime&#10;-1 = blocked (compressed or no trend)&#10;&#10;BUILT FROM: Single matrix pair (P05 trend × vol_regime).&#10;&#10;Q7 = P05 contribution directly.&#10;&#10;WEAKEST of the 7 questions — by design kept single-signal to avoid inventing thresholds around regime duration or unusualness.&#10;&#10;Most tickers show +1.00, +0.67, or 0.00 because regime is categorical (COMP/NORM/EXP).">Q7 Vol</th>
      <th class="tip gend" style="min-width:76px" onclick="sb('vol_regime')"
          data-tip="REGIME — ATR-based volatility classification.&#10;&#10;WHAT: Whether the ticker is in a compressed, normal, or expanded volatility regime.&#10;&#10;VALUES:&#10;  Compressed: low volatility, often range-bound (entries blocked in 2H)&#10;  Normal: standard volatility&#10;  Expanded: higher volatility, often trending (favourable for entries)&#10;&#10;BUILT FROM: Current ATR vs historical ATR baseline.&#10;&#10;COLOUR: Red if Compressed. White otherwise.&#10;&#10;Feeds Q7 directly. Also feeds Q1 via P05 (trend × vol_regime).">Regime</th>

      <!-- PRICE: Q5, Price Z, R20, 1D, 5D -->
      <th class="gsep tip" style="min-width:54px" onclick="sb('q5_p')"
          data-tip="Q5 PRICE — How extended the price is above (or below) the ticker's normal range.&#10;&#10;RANGE: -1.00 to +1.00&#10;&#10;IMPORTANT: Opposite intuition from Q1-Q4.&#10;  Positive Q5 = EXTENDED (stretched high — warning)&#10;  Negative Q5 = OVERSOLD or normal&#10;&#10;BUILT FROM 4 matrix pairs:&#10;  P15 price_z × range_pos (stretch + position)&#10;  P16 price_z × rel_vol (distribution signal)&#10;  P17 range_pos × pct_to_ph (range + breakout)&#10;  P32 price_d5_z × stretch_roc (stretch trajectory)&#10;&#10;Q5 = average of 4 pair contributions.&#10;&#10;EXAMPLE: +0.75 = strongly extended, watch for reversal.&#10;-0.50 = oversold, potential recovery.&#10;&#10;Used in Profile: LEADER_EXTENDED needs high Q5.">Q5 Price</th>
      <th class="tip" style="min-width:52px" onclick="sb('price_d5_z')"
          data-tip="PRICE Z — 5-day return z-score vs 60-day distribution.&#10;&#10;WHAT: How many standard deviations today's 5-day move is above or below this ticker's own normal.&#10;&#10;RANGE: Typically -3.00 to +3.00.&#10;+1 = 1 std dev above normal&#10;+2+ = statistically extended&#10;-1 = 1 std dev below normal&#10;-2+ = statistically oversold&#10;&#10;BUILT FROM: (current 5d return − 60d mean) / 60d stddev.&#10;&#10;COLOUR: Red if >= 0.85 (extension warning only). White otherwise — oversold does NOT flag red (it's not a warning, potentially an opportunity).&#10;&#10;EXAMPLE: +1.57 = notably stretched high (red).&#10;-1.30 = oversold (white, not a warning).&#10;&#10;Feeds Q5 via P15, P16, P32 and Q2 via P31.">Price Z</th>
      <th class="tip" style="min-width:44px" onclick="sb('range_pos_20d')"
          data-tip="R20 — Position in 20-day range.&#10;&#10;WHAT: Where today's close sits within the 20-day high/low range.&#10;&#10;RANGE: 0.00 to 1.00&#10;0 = at 20-day low&#10;0.5 = middle of range&#10;1 = at 20-day high&#10;&#10;BUILT FROM: (close − 20d_low) / (20d_high − 20d_low).&#10;&#10;COLOUR: Red if > 0.75 (near top, extension risk).&#10;&#10;EXAMPLE: 0.96 = at 20-day high (breakout or stretch zone).&#10;&#10;Feeds Q5 via P15 and P17.">R20</th>
      <th class="tip" style="min-width:54px" onclick="sb('perf_1d')"
          data-tip="1D% — Today's percent return.&#10;&#10;WHAT: Price change from yesterday's close.&#10;&#10;RANGE: Typically -5% to +5%.&#10;&#10;COLOUR: Green positive, red negative.&#10;&#10;EXAMPLE: -0.13% = small down day.&#10;&#10;Feeds Q5 via indirect contribution through price_z and range_pos pairs.">1D%</th>
      <th class="tip gend" style="min-width:54px" onclick="sb('perf_5d')"
          data-tip="5D% — 5-day percent return.&#10;&#10;WHAT: Cumulative percent return over last 5 bars.&#10;&#10;RANGE: Typically -15% to +15%.&#10;&#10;COLOUR: Green positive, red negative.&#10;&#10;EXAMPLE: +5.01% = strong weekly gain.&#10;&#10;Feeds Q5 as part of extension picture.">5D%</th>

      <!-- STRUCTURE: Q6, Struct, Dist PH, Dist PL -->
      <th class="gsep tip" style="min-width:54px" onclick="sb('q6_s')"
          data-tip="Q6 STRUCTURE — Geometric bullishness: 3-pivot structure classification, breakout/breakdown status, and support/resistance position.&#10;&#10;RANGE: -1.00 to +1.00.&#10;Positive = bullish geometry (UPTREND + breakouts, PH pulling away).&#10;Negative = bearish geometry (DOWNTREND + breakdowns, support lost).&#10;&#10;BUILT FROM 6 matrix pairs (all using 3-pivot structure):&#10;  P09 structure_3p × rel_vol (confirmation)&#10;  P10 structure_3p × pct_to_ph (HARNESS EARNED)&#10;  P11 structure_3p × pct_to_pl (support context)&#10;  P14 pct_to_ph × pct_to_pl (full S/R map)&#10;  P17 range_pos × pct_to_ph (range geometry)&#10;  P33 pct_to_ph × ph_roc (PH trajectory)&#10;&#10;Q6 = average of 6 pair contributions.&#10;&#10;STRUCTURE STATES used by P09/P10/P11:&#10;  Bullish progression: UPTREND_STRONG/OK (pos), UPTREND_FAIL (neutral)&#10;  Bearish progression: DOWNTREND_STRONG/OK (neg), DOWNTREND_FAIL (neutral)&#10;  Transitions: TOP_FORMING (slightly neg), BOTTOM_FORMING (slightly pos)&#10;  RANGE: 0 contribution — range-bound tickers no longer boost Q6 falsely&#10;&#10;Compare to Q1 Trend: Q6 measures structural geometry; Q1 measures multi-method trend composite.">Q6 Struct</th>
      <th class="tip" style="min-width:60px" onclick="sb('structure_3p')"
          data-tip="STRUCT — 3-pivot structure classification.&#10;&#10;WHAT: Geometric pattern across most recent 3 pivot highs and 3 pivot lows. Richer than 2-pivot — captures trend strength, weakness, and transitions.&#10;&#10;STATES:&#10;  ↑↑↑ UPTREND_STRONG — 3 HHs + 3 HLs (staircase up)&#10;  ↑↑ UPTREND_OK — clear uptrend, one wavering sequence&#10;  ↑? UPTREND_FAIL — recent high failed to make new HH (weakness)&#10;  ⤵ TOP_FORMING — highs rolling over (potential reversal)&#10;  ▬▬ RANGE — oscillating, no progression (chop)&#10;  ⤴ BOTTOM_FORMING — lows rising (potential base)&#10;  ↓? DOWNTREND_FAIL — recent low failed to make new LL (strength emerging)&#10;  ↓↓ DOWNTREND_OK — clear downtrend, one wavering sequence&#10;  ↓↓↓ DOWNTREND_STRONG — 3 LLs + 3 LHs&#10;  — INSUFFICIENT — fewer than 3 confirmed pivots&#10;&#10;BUILT FROM: 10-bar-confirmed fractal pivots from two_h_readings (daily). Most recent pivot is ~10+ days old by design — structure is a slow signal.&#10;&#10;COLOUR: Green = bullish progression. Yellow = warning/transition. Orange = topping. Red = bearish. Light blue = bottoming. Grey = range.&#10;&#10;WEIGHT: Bold = within 2% of pivot high (decision zone).&#10;&#10;EXAMPLE: ↑↑↑ means structure says uptrend confirmed across 3 pivots both sides.&#10;▬▬ means the ticker is oscillating — be wary of trading as if it's trending.&#10;&#10;Hover shows the underlying state name.&#10;&#10;Feeds Q6 (structure) and Q1 (via P10 HARNESS EARNED).">Struct</th>
      <th class="tip" style="min-width:54px" onclick="sb('pct_to_ph')"
          data-tip="DIST PH — Distance to last Pivot High.&#10;&#10;WHAT: Percent distance from current price to the most recent pivot high.&#10;&#10;RANGE: Typically -10% to +20%.&#10;Negative = price broken ABOVE last PH (breakout).&#10;Zero zone (±2%) = testing the PH.&#10;Positive = price below last PH (room above).&#10;&#10;COLOUR:&#10;  Green: ≤ -2% (fresh breakout — HARNESS EARNED signal)&#10;  Bold white: |value| < 2% (decision zone)&#10;  White: otherwise&#10;&#10;BUILT FROM: (close − last_ph) / last_ph × 100.&#10;&#10;PHASE B HARNESS: Breakouts < -2% showed +1.7% to +4.7% forward returns at 20 days with 60-71% win rates. Strongest single signal in system.&#10;&#10;Feeds Q1 and Q6 via multiple pairs.">Dist PH</th>
      <th class="tip" style="min-width:54px" onclick="sb('pct_to_pl')"
          data-tip="DIST PL — Distance to last Pivot Low.&#10;&#10;WHAT: Percent distance from current price to the most recent pivot low.&#10;&#10;RANGE: Typically -5% to +30%.&#10;Positive = price above PL (cushion).&#10;Zero zone (±2%) = at support (decision zone).&#10;Negative = price broken BELOW PL (breakdown).&#10;&#10;COLOUR:&#10;Red: < -2% (broken below PL — structural breakdown, mirrors Dist PH treatment)&#10;Bold white: |value| < 2% (at support, decision zone)&#10;White: otherwise&#10;&#10;BUILT FROM: (close − last_pl) / last_pl × 100.&#10;&#10;EXAMPLE: +7.43% = 7.4% cushion above last PL (healthy).&#10;-3.50% = broken below support (red, warning).&#10;&#10;Feeds Q6 via P11 (structure × pct_to_pl) and P14 (pct_to_ph × pct_to_pl).">Dist PL</th>
    </tr>
  </thead>
  <tbody id="tb"><tr><td colspan="28" class="msg">Loading…</td></tr></tbody>
</table></div>

<script>
const SURL='https://pzskvslhfaituzyukasl.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6c2t2c2xoZmFpdHV6eXVrYXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNzQyNTAsImV4cCI6MjA3OTY1MDI1MH0.FEZTIIQ4zgdb7uswf70XZI9Ph6ykSeDkfxooIcRIOMw';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};

const RAW_COLS='symbol,name,group_name,watchlist,trend,momentum,mom_d5,mom_d10,trend_d5,price_d5_z,range_pos_20d,perf_1d,perf_5d,vol_regime,rel_vol_20d,vol_roc_3d,pct_to_ph,pct_to_pl';
const FACT_COLS='symbol,q1_t,q2_m,q3_a,q4_v,q5_p,q6_s,q7_x,consensus,net_score,rank_alignment,fact_rank_move,profile,structure_3p';

// DEFAULT SORT: Q1 Trend descending
let all=[],filt=[],sc='q1_t',sd=-1,wl='UK ETFS',grp='',prof='';

async function load(){
  const tb=document.getElementById('tb');
  try{
    const [rawRes,factRes]=await Promise.all([
      fetch(`${SURL}/rest/v1/r_universe_live?select=${RAW_COLS}&limit=400`,{headers:H}),
      fetch(`${SURL}/rest/v1/v_fact_consensus_v2?select=${FACT_COLS}&limit=400`,{headers:H})
    ]);
    if(!rawRes.ok)throw new Error('raw: '+rawRes.status);
    if(!factRes.ok)throw new Error('fact: '+factRes.status);
    const rawData=await rawRes.json();
    const factData=await factRes.json();
    const factMap={};
    factData.forEach(f=>{factMap[f.symbol]=f;});
    all=rawData.map(r=>Object.assign({},r,factMap[r.symbol]||{}));
    buildGroups();af();
  }catch(e){
    tb.innerHTML=`<tr><td colspan="28" class="msg">Error — ${e.message}</td></tr>`;
  }
}

function setWL(w){wl=w;buildGroups();af();}
function setGrp(g){grp=g;af();}
function setProf(p){prof=p;af();}

function buildGroups(){
  const b=wl?all.filter(r=>r.watchlist===wl||r.watchlist==='BOTH'):all;
  const gs=[...new Set(b.map(r=>r.group_name).filter(Boolean))].sort();
  const sel=document.getElementById('gsel');
  const cur=sel.value;
  sel.innerHTML='<option value="">All Groups</option>'+gs.map(g=>`<option value="${g}"${g===cur?' selected':''}>${g}</option>`).join('');
  if(!gs.includes(grp)){sel.value='';grp='';}
}

function base(){
  return all.filter(r=>{
    if(wl&&r.watchlist!==wl&&r.watchlist!=='BOTH')return false;
    if(grp&&r.group_name!==grp)return false;
    if(prof&&r.profile!==prof)return false;
    if(r.rank_alignment==null)return false;
    return true;
  });
}

function af(){
  const s=document.getElementById('sr').value.toLowerCase();
  filt=base().filter(r=>{
    if(s&&!(r.symbol||'').toLowerCase().includes(s)&&!(r.name||'').toLowerCase().includes(s)&&!(r.group_name||'').toLowerCase().includes(s))return false;
    return true;
  });
  sort();render();
}

function sb(c){
  if(sc===c)sd*=-1;else{sc=c;sd=c.startsWith('rank_')||c==='profile'?1:-1;}
  document.querySelectorAll('tr.ch th').forEach(t=>t.classList.remove('s'));
  event?.target?.classList.add('s');
  sort();render();
}

function sort(){
  filt.sort((a,b)=>{
    let av=a[sc],bv=b[sc];
    if(av==null)av=sd>0?Infinity:-Infinity;
    if(bv==null)bv=sd>0?Infinity:-Infinity;
    if(typeof av==='string')return av.localeCompare(bv)*sd;
    return(av-bv)*sd;
  });
}

const mc=v=>{if(v==null||isNaN(v))return'cw';const f=parseFloat(v);return f>8?'cg':f<-8?'cr':'cw';};
const dot=v=>{if(v==null||isNaN(parseFloat(v)))return'<span class="dot dnu"></span>';return`<span class="dot ${parseFloat(v)>=0?'don':'dof'}"></span>`;};
const num=(v,d=1)=>(v==null||isNaN(v))?'<span class="cdim">—</span>':parseFloat(v).toFixed(d);
const pct=v=>{if(v==null||isNaN(v))return'<span class="cdim">—</span>';const f=parseFloat(v);return`<span class="${f>0?'cg':f<0?'cr':'cw'}">${f>=0?'+':''}${f.toFixed(2)}%</span>`;};
const relvol=v=>{if(v==null||isNaN(v))return'<span class="cdim">—</span>';const f=parseFloat(v);if(f>=1.3)return`<span style="color:#fff;font-weight:700">${f.toFixed(2)}×</span>`;return`<span class="cw">${f.toFixed(2)}×</span>`;};
const volroc=v=>{if(v==null||isNaN(v))return'<span class="cdim">—</span>';const f=parseFloat(v);return`<span class="cw">${f>=0?'+':''}${f.toFixed(2)}</span>`;};
// 3-pivot structure display with glyphs
// UPTREND_STRONG = ↑↑↑, UPTREND_OK = ↑↑, UPTREND_FAIL = ↑?
// DOWNTREND_STRONG = ↓↓↓, DOWNTREND_OK = ↓↓, DOWNTREND_FAIL = ↓?
// TOP_FORMING = ⤵ (bearish turn), BOTTOM_FORMING = ⤴ (bullish turn)
// RANGE = ▬▬ (neutral)
const STRUCT_DISPLAY={
  'UPTREND_STRONG':   {glyph:'↑↑↑', col:'#00e676'},
  'UPTREND_OK':       {glyph:'↑↑',  col:'#00e676'},
  'UPTREND_FAIL':     {glyph:'↑?',  col:'#ffeb3b'},
  'DOWNTREND_STRONG': {glyph:'↓↓↓', col:'#ff1744'},
  'DOWNTREND_OK':     {glyph:'↓↓',  col:'#ff1744'},
  'DOWNTREND_FAIL':   {glyph:'↓?',  col:'#ffeb3b'},
  'TOP_FORMING':      {glyph:'⤵',  col:'#ff9100'},
  'BOTTOM_FORMING':   {glyph:'⤴',  col:'#80d8ff'},
  'RANGE':            {glyph:'▬▬',  col:'rgba(255,255,255,0.5)'},
  'INSUFFICIENT':     {glyph:'—',   col:'rgba(255,255,255,0.35)'}
};

const struct=(s3,pct_ph)=>{
  if(s3==null||s3==='')return'<span class="cdim">—</span>';
  const d=STRUCT_DISPLAY[s3]||{glyph:s3,col:'#fff'};
  const p=parseFloat(pct_ph);
  const isNearBreakout=!isNaN(p)&&Math.abs(p)<2;
  const weight=isNearBreakout?'font-weight:700':'font-weight:400';
  return`<span style="color:${d.col};${weight}" title="${s3}">${d.glyph}</span>`;
};
const distph=v=>{if(v==null||isNaN(v))return'<span class="cdim">—</span>';const f=parseFloat(v);if(f<-2)return`<span style="color:#00e676;font-weight:600">${f.toFixed(2)}%</span>`;if(Math.abs(f)<2)return`<span style="color:#fff;font-weight:700">${f>=0?'+':''}${f.toFixed(2)}%</span>`;return`<span style="color:#fff">${f>=0?'+':''}${f.toFixed(2)}%</span>`;};
const distpl=v=>{if(v==null||isNaN(v))return'<span class="cdim">—</span>';const f=parseFloat(v);if(f<-2)return`<span style="color:#ff1744;font-weight:600">${f.toFixed(2)}%</span>`;if(Math.abs(f)<2)return`<span style="color:#fff;font-weight:700">${f>=0?'+':''}${f.toFixed(2)}%</span>`;return`<span style="color:#fff">${f>=0?'+':''}${f.toFixed(2)}%</span>`;};
const qcolor=v=>{if(v==null||isNaN(v))return'<span class="cdim">—</span>';const f=parseFloat(v);let col;if(f>0)col='#00e676';else if(f<0)col='#ff1744';else col='#fff';return`<span class="qcell" style="color:${col}">${f>=0?'+':''}${f.toFixed(2)}</span>`;};
const conscolor=v=>{if(v==null)return'<span class="cdim">—</span>';const n=parseInt(v);let col='#fff';if(n>=5)col='#00e676';else if(n<=2)col='#ff1744';return`<span style="color:${col};font-weight:600">${n}</span>`;};
const netcolor=v=>{if(v==null||isNaN(v))return'<span class="cdim">—</span>';const f=parseFloat(v);let col='#fff';if(f>0)col='#00e676';else if(f<0)col='#ff1744';return`<span style="color:${col};font-weight:600">${f>=0?'+':''}${f.toFixed(2)}</span>`;};
const rmv=v=>{if(v==null||v===''||v===undefined)return'<span class="cdim">—</span>';const i=parseInt(v);if(isNaN(i)||i===0)return'<span class="cdim">—</span>';return`<span style="color:${i>0?'#00e676':'#ff1744'}">${i>0?'+':''}${i}</span>`;};

// Profile display: map view labels to short display labels + colour
// Green: LEADER_ACCEL and SETUP_CLEAN (growth states)
// Red: WEAK
// White: everything else (warnings wrapped in strength stay white)
const PROF_DISPLAY={
  '4_LEADER_ACCEL':       {label:'LEADER ACCEL',    col:'#00e676'},
  '5_LEADER_EXTENDED':    {label:'LEADER EXTENDED', col:'#fff'},
  '6_NARROW_LEADER':      {label:'LEADER NARROW',   col:'#fff'},
  '2_NONLEADER_ACCEL':    {label:'SETUP CLEAN',     col:'#00e676'},
  '3_BROAD_MIDSTRENGTH':  {label:'SETUP BROAD',     col:'#fff'},
  '1_WEAK_ACCEL':         {label:'SETUP RECOVERY',  col:'#fff'},
  '7_WEAK_DECLINING':     {label:'WEAK',            col:'#ff1744'},
  '0_MID':                {label:'MID',             col:'#fff'}
};

const profile=v=>{
  if(!v)return'<span class="cdim">—</span>';
  const p=PROF_DISPLAY[v]||{label:v,col:'rgba(255,255,255,0.6)'};
  return`<span class="prof" style="color:${p.col}">${p.label}</span>`;
};

const VL={'EXP':'Expanded','NORM':'Normal','COMP':'Compressed'};
const VC={'COMP':'cr','EXP':'cw','NORM':'cw'};

function rowClass(cons){
  if(cons>=6)return'rhc';
  if(cons<=1)return'rxt';
  return'rmo';
}

function render(){
  const tb=document.getElementById('tb');
  if(!filt.length){tb.innerHTML='<tr><td colspan="28" class="msg">No results</td></tr>';return;}
  tb.innerHTML=filt.map(r=>{
    const pz=parseFloat(r.price_d5_z)||0;
    const r20=parseFloat(r.range_pos_20d)||0;
    const pzStyle=pz>=0.85?'color:#ff1744':'color:#fff';
    const r20Style=r20>0.75?'color:#ff1744':'color:#fff';

    return`<tr class="${rowClass(r.consensus)}">`+
      `<td title="${(r.name||'').replace(/"/g,'&quot;')}"><span style="color:#fff;font-weight:600">${r.symbol}</span></td>`+
      `<td><span style="color:#888;max-width:100px;overflow:hidden;text-overflow:ellipsis;display:block;white-space:nowrap;font-size:11px">${r.group_name||''}</span></td>`+

      `<td class="gsep-lg"><span style="color:#fff;font-weight:600">${r.rank_alignment||'—'}</span></td>`+
      `<td>${rmv(r.fact_rank_move)}</td>`+
      `<td>${conscolor(r.consensus)}</td>`+
      `<td>${netcolor(r.net_score)}</td>`+
      `<td class="gend">${profile(r.profile)}</td>`+

      `<td class="gsep">${qcolor(r.q1_t)}</td>`+
      `<td>${qcolor(r.q2_m)}</td>`+
      `<td><span class="cw">${num(r.trend)}</span></td>`+
      `<td class="gend"><span class="cw">${num(r.momentum)}</span></td>`+

      `<td class="gsep">${qcolor(r.q3_a)}</td>`+
      `<td><span class="gears">${dot(r.mom_d5)}${dot(r.mom_d10)}${dot(r.trend_d5)}</span></td>`+
      `<td class="gend"><span class="cw">${num(r.mom_d10)}</span></td>`+

      `<td class="gsep">${qcolor(r.q4_v)}</td>`+
      `<td>${relvol(r.rel_vol_20d)}</td>`+
      `<td class="gend">${volroc(r.vol_roc_3d)}</td>`+

      `<td class="gsep">${qcolor(r.q7_x)}</td>`+
      `<td class="gend"><span class="${VC[r.vol_regime]||'cw'}">${VL[r.vol_regime]||r.vol_regime||'—'}</span></td>`+

      `<td class="gsep">${qcolor(r.q5_p)}</td>`+
      `<td><span style="${pzStyle}">${num(r.price_d5_z,2)}</span></td>`+
      `<td><span style="${r20Style}">${r.range_pos_20d!=null?r20.toFixed(2):'—'}</span></td>`+
      `<td>${pct(r.perf_1d)}</td>`+
      `<td class="gend">${pct(r.perf_5d)}</td>`+

      `<td class="gsep">${qcolor(r.q6_s)}</td>`+
      `<td>${struct(r.structure_3p,r.pct_to_ph)}</td>`+
      `<td>${distph(r.pct_to_ph)}</td>`+
      `<td>${distpl(r.pct_to_pl)}</td>`+
    `</tr>`;
  }).join('');
}

load();
setInterval(load,3*60*1000);

const SPEC_FALLBACK=`Loading spec from Supabase…

If this message persists, check that:
  1. spec_2h_sections table exists in Supabase
  2. RLS policy allows anon SELECT
  3. Network connection is working

Run spec_2h_sections.sql to create/populate the table.`;

async function openSpec(){
  document.getElementById('specOverlay').classList.add('on');
  const body=document.getElementById('specBody');
  const head=document.getElementById('specHead');
  body.textContent=SPEC_FALLBACK;
  head.textContent='loading...';
  try{
    const res=await fetch(`${SURL}/rest/v1/spec_2h_sections?select=section_order,section_title,content,updated_at&order=section_order.asc`,{headers:H});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const sections=await res.json();
    if(!sections.length){body.textContent='Spec table exists but is empty. Run spec_2h_sections.sql to populate.';head.textContent='empty';return;}
    const latest=sections.reduce((a,s)=>{const d=new Date(s.updated_at);return d>a?d:a;},new Date(0));
    body.textContent=sections.map(s=>{
      const underline='='.repeat(s.section_title.length);
      return`${s.section_order}. ${s.section_title}\n${underline}\n${s.content.trim()}\n`;
    }).join('\n\n');
    head.textContent=`${sections.length} sections · updated ${latest.toISOString().slice(0,10)}`;
  }catch(e){
    body.textContent=`Error loading spec: ${e.message}\n\n${SPEC_FALLBACK}`;
    head.textContent='error';
  }
}

function closeSpec(){
  document.getElementById('specOverlay').classList.remove('on');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSpec();
});
</script>

<div class="spec-overlay" id="specOverlay" onclick="if(event.target===this)closeSpec()">
  <div class="spec-modal">
    <div class="spec-head">
      <span class="t">2H SPEC</span>
      <span class="m" id="specHead">—</span>
      <span class="x" onclick="closeSpec()" title="Close (Esc)">×</span>
    </div>
    <div class="spec-body" id="specBody">Loading…</div>
  </div>
</div>

</body></html>
